name: pc-shop
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pc_shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - shop-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d pc_shop"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  shop-data:

