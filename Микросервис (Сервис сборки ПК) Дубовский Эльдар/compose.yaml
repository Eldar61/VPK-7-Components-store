name: pc-assembly-eldar
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pc_assembly
      POSTGRES_USER: assembly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["assembly-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assembly -d pc_assembly"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  assembly-data:
